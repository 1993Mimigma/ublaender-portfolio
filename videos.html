<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Videos - Ubländer Productions</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121214;
            color: #e1e1e6;
            min-height: 100vh;
            padding: 40px 20px;
        }

        header {
            text-align: center;
            max-width: 900px;
            margin: 0 auto 40px auto;
        }

        h1 {
            font-size: 2.2rem;
            color: #ffffff;
            margin-bottom: 10px;
            letter-spacing: 0.5px;
        }

        p.subtitle {
            color: #a8a8b3;
            font-size: 1rem;
        }

        .video-container {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 25px;
        }

        .video-card {
            background: #1a1a1e;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid #29292e;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
            transition: transform 0.2s ease, border-color 0.2s ease;
        }

        .video-card:hover {
            transform: translateY(-5px);
            border-color: #0070f3;
        }

        /* 16:9 Responsive Container für YouTube Iframes */
        .video-wrapper {
            position: relative;
            width: 100%;
            padding-top: 56.25%; /* 16:9 Aspect Ratio */
            background-color: #000;
        }

        .video-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }

        .video-info {
            padding: 15px 20px;
        }

        .video-title {
            font-size: 1.05rem;
            font-weight: 600;
            color: #ffffff;
            text-transform: capitalize;
        }

        .no-videos {
            text-align: center;
            grid-column: 1 / -1;
            padding: 50px 20px;
            color: #71717a;
            font-size: 1.1rem;
        }

        /* Watermark Brand Tag unten rechts */
        .brand-tag {
            text-align: center;
            margin-top: 50px;
            color: #52525b;
            font-size: 0.85rem;
        }
    </style>
</head>
<body>

    <header>
        <h1>Ubländer Productions — Videogalerie</h1>
        <p class="subtitle">Exklusive Videos & Projekt-Highlights</p>
    </header>

    <main class="video-container" id="videoGrid">
        <!-- Hier werden die ungelisteten YouTube-Videos automatisch eingefügt -->
    </main>

    <div class="brand-tag">
        &copy; Ubländer Productions
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const videoGrid = document.getElementById("videoGrid");

            // Option 1: Automatisch aus deiner videos.json / build.js laden
            fetch('videos.json')
                .then(response => {
                    if (!response.ok) throw new Error("Keine videos.json vorhanden");
                    return response.json();
                })
                .then(videos => renderVideos(videos))
                .catch(() => {
                    // Option 2: Fallback-Liste für deine ungelisteten YouTube-Links / IDs
                    // Füge hier einfach deine YouTube-IDs oder komplette Links ein:
                    const youtubeVideos = [
                        { id: "dQw4w9WgXcQ", title: "Beispiel Video 1" },
                        // { id: "DEINE_YOUTUBE_ID", title: "Dein Titel" }
                    ];
                    
                    if (youtubeVideos.length > 0 && youtubeVideos[0].id !== "dQw4w9WgXcQ") {
                        renderVideos(youtubeVideos);
                    } else {
                        showNoVideosMessage();
                    }
                });

            function renderVideos(videos) {
                videoGrid.innerHTML = "";

                if (!videos || videos.length === 0) {
                    showNoVideosMessage();
                    return;
                }

                videos.forEach(video => {
                    const youtubeId = extractYouTubeId(video.id || video.url || video);
                    const title = video.title || "Ubländer Productions Video";

                    if (!youtubeId) return;

                    const card = document.createElement("div");
                    card.className = "video-card";

                    card.innerHTML = `
                        <div class="video-wrapper">
                            <iframe 
                                src="https://www.youtube-nocookie.com/embed/${youtubeId}?rel=0" 
                                title="${title}" 
                                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                                allowfullscreen>
                            </iframe>
                        </div>
                        <div class="video-info">
                            <div class="video-title">${title}</div>
                        </div>
                    `;

                    videoGrid.appendChild(card);
                });
            }

            function extractYouTubeId(urlOrId) {
                if (!urlOrId) return null;
                // Extrahiert die 11-stellige YouTube-ID (egal ob vollständiger Link oder nur ID)
                const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
                const match = urlOrId.match(regExp);
                return (match && match[2].length === 11) ? match[2] : urlOrId;
            }

            function showNoVideosMessage() {
                videoGrid.innerHTML = `
                    <div class="no-videos">
                        <p>Derzeit sind keine Videos im Ordner "Videos" eingetragen.</p>
                    </div>
                `;
            }
        });
    </script>

</body>
</html>
