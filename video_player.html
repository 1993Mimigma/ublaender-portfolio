<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Player | Ubländer Productions</title>
    <style>
        :root {
            --bg-color: #0d0e15;
            --card-bg: #161824;
            --text-color: #f0f0f0;
            --accent-color: #00f2fe;
            --text-muted: #a0a0a0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background-color: rgba(13, 14, 21, 0.95);
            padding: 1.2rem 2rem;
            border-bottom: 1px solid #25283b;
            text-align: center;
        }

        header a {
            color: var(--text-color);
            text-decoration: none;
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: 2px;
        }

        main {
            flex: 1;
            max-width: 900px;
            width: 100%;
            margin: 3rem auto;
            padding: 0 1.5rem;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid #25283b;
            border-radius: 12px;
            padding: 2.5rem;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        h1 {
            font-size: 1.8rem;
            margin-bottom: 0.5rem;
            color: #fff;
        }

        .subtitle {
            color: var(--text-muted);
            margin-bottom: 2rem;
        }

        /* SCHUTZ-BEREICH / FORMULAR */
        #protected-area {
            display: block;
        }

        .lock-icon {
            font-size: 3rem;
            margin-bottom: 1rem;
            display: block;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
        }

        input[type="password"] {
            width: 100%;
            padding: 0.8rem 1rem;
            background: #0d0e15;
            border: 1px solid #25283b;
            border-radius: 6px;
            color: #fff;
            font-size: 1rem;
            transition: border-color 0.3s;
        }

        input[type="password"]:focus {
            outline: none;
            border-color: var(--accent-color);
        }

        button, .btn-submit {
            padding: 0.8rem 1.8rem;
            background: linear-gradient(135deg, #00c6ff 0%, #0072ff 100%);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.3s;
        }

        button:hover, .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 114, 255, 0.4);
        }

        .error-message {
            color: #ff4757;
            margin-top: 1rem;
            display: none;
            font-weight: 500;
        }

        .request-access-box {
            margin-top: 2rem;
            padding-top: 1.5rem;
            border-top: 1px solid #25283b;
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        .request-access-box a {
            color: var(--accent-color);
            text-decoration: underline;
        }

        /* VIDEO-CONTAINER (INITIALL VERSTECKT) */
        #video-container {
            display: none;
        }

        .responsive-video {
            position: relative;
            padding-bottom: 56.25%; /* 16:9 Aspect Ratio */
            height: 0;
            overflow: hidden;
            border-radius: 8px;
            background: #000;
        }

        .responsive-video iframe,
        .responsive-video video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }

        .back-link {
            display: inline-block;
            margin-top: 1.5rem;
            color: var(--text-muted);
            text-decoration: none;
            transition: color 0.3s;
        }

        .back-link:hover {
            color: var(--accent-color);
        }
    </style>
</head>
<body>

    <header>
        <a href="index.html">UBLÄNDER PRODUCTIONS</a>
    </header>

    <main>
        <div class="card">
            <h1 id="video-title">Video wird geladen...</h1>
            <p class="subtitle" id="video-subtitle">Dieses Video ist privat und erfordert ein Passwort zur Freischaltung.</p>

            <!-- PASSWORT FORMULAR -->
            <div id="protected-area">
                <span class="lock-icon">🔒</span>
                <form id="password-form" onsubmit="checkPassword(event)">
                    <div class="form-group">
                        <label for="password">Passwort eingeben:</label>
                        <input type="password" id="password" placeholder="Passwort hier eingeben" required>
                    </div>
                    <button type="submit">Video freischalten</button>
                    <p class="error-message" id="error-msg">Falsches Passwort! Bitte versuche es erneut.</p>
                </form>

                <div class="request-access-box">
                    <p>Du hast noch kein Passwort? <a href="index.html#kontakt">Frage hier unverbindlich den Zugriff an</a>.</p>
                </div>
            </div>

            <!-- VIDEO PLAYER (WIRD ERST NACH PASSWORT-EINGABE ANGEZEIGT) -->
            <div id="video-container">
                <div class="responsive-video" id="player-wrapper">
                    <!-- Der iFrame oder MP4-Player wird dynamisch per JS eingefügt -->
                </div>
            </div>

            <a href="videos.html" class="back-link">← Zurück zur Übersicht</a>
        </div>
    </main>

    <script>
        // ==========================================
        // 1. HIER DEIN WUNSCHPASSWORT EINTRAGEN:
        // ==========================================
        const KORREKTES_PASSWORT = "DRUCKLUFTKEVINUBLÄNDER2026"; 

        
        // Variable für den Video-Link
        let dynamicVideoUrl = "";

        // ==========================================
        // 2. DYNAMISCHES VIDEO LADEN (aus videos.json)
        // ==========================================
        document.addEventListener("DOMContentLoaded", () => {
            // Lese Parameter aus der URL aus, z.B. video_player.html?video=druckluft
            const urlParams = new URLSearchParams(window.location.search);
            const videoId = urlParams.get('video');

            if (videoId) {
                // Hole die videos.json Datei
                fetch('videos.json')
                    .then(response => response.json())
                    .then(videos => {
                        // Suche das Video, dessen Titel mit dem URL-Parameter übereinstimmt
                        const gefundenesVideo = videos.find(v => v.titel === videoId);

                        if (gefundenesVideo) {
                            dynamicVideoUrl = gefundenesVideo.url;
                            document.getElementById("video-title").innerText = "Exklusiv: " + gefundenesVideo.titel;
                        } else {
                            // Video nicht gefunden
                            document.getElementById("video-title").innerText = "Video nicht gefunden";
                            document.getElementById("protected-area").style.display = "none";
                            document.getElementById("video-subtitle").innerText = "Das angefragte Video existiert leider nicht.";
                        }
                    })
                    .catch(error => {
                        console.error("Fehler beim Laden der videos.json:", error);
                        document.getElementById("video-title").innerText = "Ladefehler";
                        document.getElementById("video-subtitle").innerText = "Die Videodatenbank konnte nicht geladen werden.";
                    });
            } else {
                // Wenn kein Parameter übergeben wurde (man hat die Seite einfach so geöffnet)
                document.getElementById("video-title").innerText = "Kein Video ausgewählt";
                document.getElementById("protected-area").style.display = "none";
                document.getElementById("video-subtitle").innerText = "Bitte wähle ein Video aus der Videogalerie aus.";
            }
        });

        // ==========================================
        // 3. PASSWORT ÜBERPRÜFEN UND VIDEO STARTEN
        // ==========================================
        function checkPassword(event) {
            event.preventDefault();
            const eingabe = document.getElementById("password").value;
            const errorMsg = document.getElementById("error-msg");

            if (eingabe === KORREKTES_PASSWORT) {
                // Passwort richtig!
                if (!dynamicVideoUrl) {
                    alert("Es gab ein Problem beim Laden der Video-URL.");
                    return;
                }

                document.getElementById("protected-area").style.display = "none";
                document.getElementById("video-subtitle").innerText = "Zugriff gewährt. Viel Spaß beim Ansehen!";
                
                // Video einbetten (autoplay wird hinzugefügt, falls nicht schon vorhanden)
                const playerWrapper = document.getElementById("player-wrapper");
                
                // Wir fügen &autoplay=1 hinzu, damit es nach Passworteingabe sofort startet
                const finalUrl = dynamicVideoUrl.includes('?') ? dynamicVideoUrl + '&autoplay=1' : dynamicVideoUrl + '?autoplay=1';
                
                playerWrapper.innerHTML = `<iframe src="${finalUrl}" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>`;
                
                document.getElementById("video-container").style.display = "block";
            } else {
                // Passwort falsch!
                errorMsg.style.display = "block";
            }
        }
    </script>
</body>
</html>
