<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Player - Ubländer Productions</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121214;
            color: #e1e1e6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            width: 100%;
            background: #1a1a1e;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
            border: 1px solid #29292e;
            text-align: center;
        }

        h1 {
            font-size: 1.8rem;
            color: #ffffff;
            margin-bottom: 8px;
        }

        p.subtitle {
            color: #a8a8b3;
            font-size: 0.95rem;
            margin-bottom: 25px;
        }

        /* Responsive 16:9 Container */
        .video-wrapper {
            position: relative;
            width: 100%;
            padding-top: 56.25%; /* 16:9 Aspect Ratio */
            background-color: #000;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
            border: 1px solid #323238;
        }

        .video-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }

        .brand-footer {
            margin-top: 25px;
            color: #52525b;
            font-size: 0.85rem;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Ubländer Productions</h1>
        <p class="subtitle">Exklusives Video</p>

        <div class="video-wrapper">
            <iframe 
                src="https://www.youtube-nocookie.com/embed/Psh_S0id81A?rel=0" 
                title="Ubländer Productions Video" 
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                allowfullscreen>
            </iframe>
        </div>

        <div class="brand-footer">
            &copy; Ubländer Productions
        </div>
    </div>

</body>
</html>
