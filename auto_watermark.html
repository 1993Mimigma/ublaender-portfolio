<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Automatisches Wasserzeichen - Ubländer Productions</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 20px;
        }

        /* Das Wasserzeichen-Overlay über den Bildern */
        .ublaender-watermark-wrapper {
            position: relative !important;
            display: inline-block !important;
            overflow: hidden !important;
            max-width: 100%;
        }

        .ublaender-watermark-wrapper::after {
            content: "Ubländer Productions";
            position: absolute;
            bottom: 12px;
            right: 15px;
            color: rgba(255, 255, 255, 0.85);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-size: clamp(12px, 2vw, 22px);
            font-weight: bold;
            letter-spacing: 0.5px;
            text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.9), 0px 0px 6px rgba(0, 0, 0, 0.7);
            pointer-events: none;
            user-select: none;
            z-index: 999;
        }

        /* Falls Bild-Hover-Effekte existieren */
        .ublaender-watermark-wrapper img {
            display: block;
            max-width: 100%;
            height: auto;
        }
    </style>
</head>
<body>

    <!--
      WICHTIG: 
      Lade diese Datei einfach als 'watermark.html' in deinen Ordner hoch.
      Das folgende Skript sucht sich automatisch ALLE Fotos deiner Webseite 
      (auch dynamisch nachgeladene Alben/Ordner) und legt das Wasserzeichen 
      ohne dein Zutun darüber!
    -->

    <script>
        (function() {
            function applyWatermark(img) {
                // Keine Wasserzeichen auf Logos/Icons oder bereits bearbeiteten Bildern
                if (img.dataset.watermarked || img.closest('.ublaender-watermark-wrapper')) return;
                
                // Nur Bilder ab einer bestimmten Mindestgröße bearbeiten (keine kleinen UI-Icons)
                if (img.complete && img.naturalWidth < 100 && img.naturalHeight < 100) return;

                const parent = img.parentElement;
                if (parent && !parent.classList.contains('ublaender-watermark-wrapper')) {
                    const wrapper = document.createElement('div');
                    wrapper.className = 'ublaender-watermark-wrapper';
                    
                    // Behalte ursprüngliche Stile bei
                    if (img.style.cssText) {
                        wrapper.style.cssText = img.style.cssText;
                    }

                    img.parentNode.insertBefore(wrapper, img);
                    wrapper.appendChild(img);
                    img.dataset.watermarked = "true";
                }
            }

            // 1. Alle aktuell vorhandenen Bilder verarbeiten
            function initWatermarks() {
                document.querySelectorAll('img').forEach(img => {
                    if (img.complete) {
                        applyWatermark(img);
                    } else {
                        img.addEventListener('load', () => applyWatermark(img));
                    }
                });
            }

            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', initWatermarks);
            } else {
                initWatermarks();
            }

            // 2. Automatischer Observer für Ordner/Alben, die per JavaScript (build.js) geladen werden
            const observer = new MutationObserver((mutations) => {
                mutations.forEach((mutation) => {
                    mutation.addedNodes.forEach((node) => {
                        if (node.nodeType === 1) {
                            if (node.tagName === 'IMG') {
                                applyWatermark(node);
                            } else {
                                node.querySelectorAll('img').forEach(applyWatermark);
                            }
                        }
                    });
                });
            });

            observer.observe(document.body, {
                childList: true,
                subtree: true
            });
        })();
    </script>

</body>
</html>
